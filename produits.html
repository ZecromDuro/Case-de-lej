<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="images/favicon.png"/>
  <title>Nos Produits — La Case de LEJ</title>
  <meta name="description" content="CazChoco, biscuiterie, jus & nectars, liqueurs, sirops, confitures, thés, coffrets de fête et kits cérémonie : les 20 catégories de La Case de LEJ."/>
  <link rel="stylesheet" href="css/variables.css?v=20"/>
  <link rel="stylesheet" href="css/global.css?v=20"/>
  <link rel="stylesheet" href="css/account.css?v=20"/>
  <link rel="stylesheet" href="css/produits.css?v=20"/>
</head>
<body>

  <div id="navbarPlaceholder"></div>

  <div class="page-hero">
    <span class="section-label" style="justify-content:center;display:flex">Notre gamme</span>
    <h1>Nos <span>Produits</span></h1>
    <p>Vingt catégories, quatre univers : l'épicerie sucrée, les boissons, la maison et les coffrets d'occasion.</p>
  </div>

  <section class="section">
    <div class="container">

      <!-- Tri : les catégories sont empilées dans ce bouton et se déplient au clic -->
      <div class="filter-dock">
        <button class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="17" x2="14" y2="17"/>
          </svg>
          <span class="filter-toggle-label">Trier par catégorie</span>
          <span class="filter-toggle-value" id="filterCurrent">Tout voir</span>
          <svg class="filter-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <div class="filter-panel" id="filterPanel" hidden>
          <div class="filter-bar" id="filterBar"></div>
        </div>
      </div>

      <!-- Sections, univers par univers (générées depuis le catalogue) -->
      <div id="catalogSections"></div>

    </div>
  </section>

  <!-- Product modal -->
  <div class="product-modal-overlay" id="productModal">
    <div class="product-modal" role="dialog">
      <button class="product-modal-close" id="modalClose" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="product-modal-img" id="modalImg"></div>
      <div class="product-modal-body">
        <div class="product-modal-category" id="modalCategory"></div>
        <h2 class="product-modal-name" id="modalName"></h2>
        <p class="product-modal-desc" id="modalDesc"></p>
        <div class="product-modal-footer">
          <span class="product-modal-price" id="modalPrice"></span>
          <button class="btn btn-primary" id="modalAddBtn">Ajouter au panier</button>
        </div>
      </div>
    </div>
  </div>

  <div id="cartPlaceholder"></div>
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js?v=20"></script>
  <script src="js/catalog.js?v=20"></script>
  <script src="js/auth.js?v=20"></script>
  <script src="js/checkout.js?v=20"></script>
  <script src="js/components.js?v=20"></script>
  <script src="js/nav.js?v=20"></script>
  <script src="js/cart.js?v=20"></script>
  <script src="js/reco.js?v=20"></script>
  <script>
    /* ---------- Rendu du catalogue ---------- */

    function productCard(p) {
      return `
        <div class="product-card reveal">
          <div class="product-img" style="cursor:pointer" onclick="openModal('${p.id}')">
            ${catalog.visual(p)}
            ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
            ${catalog.estEpuise(p) ? `<span class="product-badge is-out">Épuisé</span>` : ''}
          </div>
          <div class="product-body">
            <div class="product-category">${catalog.label(p.category)}</div>
            <h3 class="product-name">${p.name}</h3>
            <p class="product-desc">${(p.description || '').slice(0, 80)}…</p>
            <div class="product-footer">
              <span class="product-price">${p.price.toLocaleString('fr-FR')} FCFA</span>
              <button class="product-add-btn" onclick="cart.add({id:'${p.id}',name:'${p.name}',price:${p.price}},this);reco.noter('${p.id}','panier')"
                      aria-label="Ajouter ${p.name} au panier" ${catalog.estEpuise(p) ? 'disabled' : ''}>+</button>
            </div>
          </div>
        </div>`;
    }

    /* Catégorie encore vide : on le dit franchement plutôt que d'afficher un vide. */
    function comingSoon(c) {
      return `
        <div class="category-empty reveal">
          <div class="category-empty-icon">${catalog.icon(c.slug, 26)}</div>
          <div>
            <div class="category-empty-title">${c.label} — sur commande</div>
            <p class="category-empty-text">${c.blurb} Cette gamme se prépare à l'atelier : écrivez-nous pour connaître les disponibilités du moment.</p>
          </div>
          <a href="contact.html" class="btn btn-secondary">Nous écrire</a>
        </div>`;
    }

    function renderCatalog() {
      // Filtres : Tout voir + une puce par catégorie
      document.getElementById('filterBar').innerHTML =
        `<button class="filter-btn active" data-filter="all">Tout voir</button>` +
        catalog.categories.map(c => {
          const n = catalog.count(c.slug);
          return `<button class="filter-btn${n ? '' : ' is-soon'}" data-filter="${c.slug}">
                    ${c.label}${n ? ` <span class="filter-count">${n}</span>` : ''}
                  </button>`;
        }).join('');

      // Sections regroupées par univers
      document.getElementById('catalogSections').innerHTML = catalog.groups.map(g => `
        <div class="catalog-group" data-group="${g.id}">
          <div class="catalog-group-head">
            <h2 class="catalog-group-title">${g.label}</h2>
            <p class="catalog-group-blurb">${g.blurb}</p>
          </div>
          ${catalog.categoriesOfGroup(g.id).map(c => {
            const items = catalog.byCategory(c.slug);
            return `
              <div class="category-section" id="${c.slug}" data-category="${c.slug}">
                <h2 class="products-section-title">
                  <span class="products-section-icon">${catalog.icon(c.slug, 20)}</span>
                  ${c.label}
                  ${items.length ? `<em class="products-section-count">${items.length} produit${items.length > 1 ? 's' : ''}</em>` : ''}
                </h2>
                ${items.length
                  ? `<div class="products-grid">${items.map(productCard).join('')}</div>`
                  : comingSoon(c)}
              </div>`;
          }).join('')}
        </div>`).join('');

      document.querySelectorAll('.reveal:not(.visible)').forEach(el => revealObserver.observe(el));
    }

    /* ---------- Filtrage ---------- */

    function applyFilter(filter, keepOpen) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === filter));

      document.getElementById('filterCurrent').textContent =
        filter === 'all' ? 'Tout voir' : catalog.label(filter);
      if (!keepOpen) setFilterPanel(false);

      document.querySelectorAll('.category-section').forEach(sec =>
        sec.classList.toggle('hidden', filter !== 'all' && sec.dataset.category !== filter));

      // Un univers dont toutes les catégories sont masquées disparaît aussi
      document.querySelectorAll('.catalog-group').forEach(grp => {
        const visible = [...grp.querySelectorAll('.category-section')].some(s => !s.classList.contains('hidden'));
        grp.classList.toggle('hidden', !visible);
      });

      if (filter !== 'all') {
        setTimeout(() => document.getElementById(filter)
          ?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
      }
    }

    /* ---------- Fiche produit ---------- */

    function openModal(id) {
      const p = catalog.product(id);
      if (!p) return;
      if (typeof reco !== 'undefined') reco.noter(p.id, 'vue');
      document.getElementById('modalImg').innerHTML = catalog.visual(p, 'product-modal-mono');
      document.getElementById('modalCategory').textContent = catalog.label(p.category);
      document.getElementById('modalName').textContent = p.name;
      document.getElementById('modalDesc').textContent = p.description || '';
      document.getElementById('modalPrice').textContent = p.price.toLocaleString('fr-FR') + ' FCFA';
      const addBtn = document.getElementById('modalAddBtn');
      addBtn.disabled = catalog.estEpuise(p);
      addBtn.textContent = catalog.estEpuise(p) ? 'Épuisé' : 'Ajouter au panier';
      addBtn.onclick = () => {
        cart.add({ id: p.id, name: p.name, price: p.price }, addBtn);
        closeModal();
      };
      document.getElementById('productModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('productModal')?.addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById('modalClose')?.addEventListener('click', closeModal);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ---------- Dépliage du tri ---------- */

    function setFilterPanel(open) {
      const panel  = document.getElementById('filterPanel');
      const toggle = document.getElementById('filterToggle');
      if (!panel) return;

      toggle.setAttribute('aria-expanded', String(open));
      toggle.classList.toggle('is-open', open);

      if (open) {
        panel.hidden = false;
        panel.style.height = '0px';
        requestAnimationFrame(() => { panel.style.height = panel.scrollHeight + 'px'; });
      } else {
        panel.style.height = panel.scrollHeight + 'px';
        requestAnimationFrame(() => { panel.style.height = '0px'; });
      }
    }

    document.addEventListener('lej:ready', () => {
      renderCatalog();

      const panel = document.getElementById('filterPanel');
      panel.addEventListener('transitionend', e => {
        if (e.propertyName !== 'height') return;
        if (panel.style.height === '0px') panel.hidden = true;
        else panel.style.height = 'auto';   // reste souple si l'écran change
      });

      document.getElementById('filterToggle').addEventListener('click', () => {
        setFilterPanel(document.getElementById('filterToggle').getAttribute('aria-expanded') !== 'true');
      });

      document.getElementById('filterBar').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (btn) applyFilter(btn.dataset.filter);
      });

      // Fermeture au clic extérieur et à Échap
      document.addEventListener('click', e => {
        if (!e.target.closest('.filter-dock')) setFilterPanel(false);
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') setFilterPanel(false);
      });

      // Arrivée depuis un lien #categorie
      const hash = location.hash.replace('#', '');
      if (hash && catalog.category(hash)) applyFilter(hash);
    });
  </script>
</body>
</html>
